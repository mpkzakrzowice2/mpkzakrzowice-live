services:
  - type: web
    name: mpkzakrzowice-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: MAP_ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
